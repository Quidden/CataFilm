services:
  app:
    build:
      context: .
    volumes:
      - ./.env:/var/www/html/.env:ro
      - ./database/database.sqlite:/var/www/html/database/database.sqlite
    expose:
      - "9000"

  nginx:
    image: nginx:alpine
    depends_on:
      - app
    ports:
      - "8000:80"
    volumes:
      - .:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
